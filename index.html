<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daya NOSA - Network Operational Standard Audit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            daya: {
              red: '#D32F2F',
              darkred: '#9A0007',
              gold: '#E6A100',
              bg: '#F4F5F7'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-daya-bg font-sans text-gray-800 pb-20 md:pb-0 min-h-screen">

  <!-- SECTION LOGIN & REGISTER -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100 space-y-5">
      
      <div class="text-center space-y-2">
        <div class="flex justify-center items-center gap-2">
          <div class="w-10 h-10 bg-daya-red text-white rounded-2xl flex items-center justify-center font-black text-xl shadow-md">DN</div>
          <div class="text-left">
            <h1 class="text-xl font-extrabold text-gray-900 leading-none">DAYA NOSA</h1>
            <p class="text-[10px] font-bold text-daya-gold tracking-widest uppercase">NOS Assistant</p>
          </div>
        </div>
        <h2 id="authTitle" class="text-2xl font-black text-gray-800 pt-2">masuk/daftar</h2>
      </div>

      <div class="flex bg-gray-100 p-1 rounded-2xl text-xs font-bold text-gray-500">
        <button type="button" id="tabModeLogin" onclick="setAuthMode('login')" class="flex-1 py-2 rounded-xl bg-white text-gray-900 shadow-sm transition">Masuk</button>
        <button type="button" id="tabModeRegister" onclick="setAuthMode('register')" class="flex-1 py-2 rounded-xl hover:text-gray-900 transition">Daftar Akun</button>
      </div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        
        <div id="nameInputGroup" class="hidden">
          <label class="block text-xs font-bold text-gray-600 mb-1">Nama Lengkap</label>
          <input type="text" id="regNama" placeholder="Masukkan nama Anda..." class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-daya-red text-sm font-semibold transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">ID Karyawan / Email / NIK</label>
          <input type="text" id="authEmail" required placeholder="kacab1@daya.com" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-daya-red text-sm font-semibold transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Password / PIN</label>
          <input type="password" id="authPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-daya-red text-sm font-semibold transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-2">pilih peran anda</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectRole('Kepala Cabang')" id="roleKacab" class="role-btn border-2 border-daya-red bg-red-50 p-2.5 rounded-2xl text-center hover:border-daya-red transition">
              <span class="block text-[11px] font-extrabold text-gray-800">Kepala Cabang</span>
            </button>
            <button type="button" onclick="selectRole('PIC NOS')" id="rolePic" class="role-btn border-2 border-gray-200 p-2.5 rounded-2xl text-center hover:border-daya-red transition">
              <span class="block text-[11px] font-extrabold text-gray-800">PIC NOS</span>
            </button>
            <button type="button" onclick="selectRole('FLP')" id="roleFlp" class="role-btn border-2 border-gray-200 p-2.5 rounded-2xl text-center hover:border-daya-red transition">
              <span class="block text-[11px] font-extrabold text-gray-800">FLP</span>
            </button>
          </div>
        </div>

        <div id="cabangInputGroup" class="hidden">
          <label class="block text-xs font-bold text-gray-600 mb-1">Nama Cabang</label>
          <input type="text" id="authCabang" placeholder="Soekarno Hatta" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-daya-red text-sm font-semibold transition">
        </div>

        <button type="submit" id="btnSubmitAuth" class="w-full bg-daya-red hover:bg-daya-darkred text-white font-extrabold py-3.5 rounded-2xl transition duration-200 shadow-lg shadow-red-200 text-sm">
          masuk
        </button>

        <div class="text-center pt-1">
          <a href="#" class="text-xs font-bold text-gray-400 hover:text-daya-red">lupa password?</a>
        </div>
      </form>
    </div>
  </div>

  <!-- SECTION MAIN DASHBOARD -->
  <div id="dashboardSection" class="hidden min-h-screen">
    
    <header class="bg-white border-b border-gray-100 px-6 py-4 sticky top-0 z-30 flex justify-between items-center shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center font-black text-daya-red text-sm" id="userAvatar">R</div>
        <div>
          <h1 class="text-xs font-medium text-gray-500">halo, <span id="userNameBadge" class="font-extrabold text-gray-900">-</span> 👋</h1>
          <p class="text-[11px] font-bold text-daya-gold" id="userRoleBadge">-</p>
        </div>
      </div>
      <button onclick="handleLogout()" class="text-xs font-bold text-gray-400 hover:text-daya-red bg-gray-100 px-3 py-1.5 rounded-xl transition">
        Keluar
      </button>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
      
      <div id="tabHome" class="tab-content space-y-6">
        <div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm flex justify-between items-center">
          <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Cabang Aktif</p>
            <h3 class="text-xl font-black text-gray-800" id="dashCabangName">Cabang Soekarno Hatta</h3>
          </div>
          <div class="text-right">
            <span class="text-[10px] font-bold text-gray-400 uppercase">Skor NOS</span>
            <div class="text-xs font-black bg-amber-100 text-amber-800 px-3 py-1 rounded-full" id="dashSkorNOS">GOLD / PLATINUM</div>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="menuGrid"></div>

        <div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm flex items-center gap-5">
          <div class="relative w-20 h-20 flex-shrink-0 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
              <path class="text-gray-100" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path id="donutCircle" class="text-emerald-500" stroke-dasharray="85, 100" stroke-width="4" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <span class="absolute font-black text-gray-800 text-base" id="picaPercentageText">0%</span>
          </div>
          <div class="flex-1 space-y-1">
            <h3 class="font-extrabold text-xs text-gray-900 uppercase tracking-tight">PERFORMA CABANG ANDA</h3>
            <p class="text-[11px] text-gray-500">PICA terselesaikan bulan ini</p>
            <button onclick="switchTab('pica')" class="text-xs font-bold text-daya-red hover:underline flex items-center gap-1 pt-1">
              Lihat Dashboard PICA &rsaquo;
            </button>
          </div>
        </div>
      </div>

      <div id="tabPica" class="tab-content hidden space-y-5">
        <div class="flex justify-between items-center">
          <h3 class="text-xl font-black text-gray-800">Dashboard PICA</h3>
          <button onclick="loadPICAData()" class="text-xs font-bold text-daya-red bg-red-50 px-3 py-1.5 rounded-xl hover:bg-red-100 transition">Refresh</button>
        </div>
        <div id="picaContainer" class="space-y-3">
          <p class="text-xs text-gray-400">Memuat item PICA...</p>
        </div>
      </div>

      <div id="tabReferensi" class="tab-content hidden space-y-4">
        <h3 class="text-xl font-black text-gray-800">Referensi Standar Visual</h3>
        <div id="referensiContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <p class="text-xs text-gray-400">Memuat referensi standar...</p>
        </div>
      </div>

    </main>

    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 py-2 px-6 flex justify-around items-center z-40">
      <button onclick="switchTab('home')" class="flex flex-col items-center gap-1 text-daya-red font-bold text-[10px]">
        <span>🏠</span> home
      </button>
      <button onclick="switchTab('pica')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-daya-red font-bold text-[10px]">
        <span>📊</span> PICA
      </button>
      <button onclick="switchTab('referensi')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-daya-red font-bold text-[10px]">
        <span>📖</span> Referensi
      </button>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
