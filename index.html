<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daya NOSA - NOS Assistant</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            daya: {
              red: '#D32F2F',
              darkred: '#9A0007',
              gold: '#E6A100',
              bg: '#F4F5F7'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-daya-bg font-sans text-gray-800 pb-20 md:pb-0">

  <!-- SECTION LOGIN PERAN -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100 space-y-6">
      
      <!-- Brand Logo Header -->
      <div class="text-center space-y-2">
        <div class="flex justify-center items-center gap-2">
          <div class="w-10 h-10 bg-daya-red text-white rounded-xl flex items-center justify-center font-black text-xl shadow-md">DN</div>
          <div class="text-left">
            <h1 class="text-xl font-extrabold text-gray-900 leading-none">DAYA NOSA</h1>
            <p class="text-[10px] font-bold text-daya-gold tracking-widest uppercase">NOS Assistant</p>
          </div>
        </div>
        <h2 class="text-2xl font-black text-gray-800 pt-2">masuk/daftar</h2>
      </div>

      <!-- Form Inputs -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">ID karyawan / NIK</label>
          <input type="text" id="emailInput" placeholder="Masukkan ID / Email..." class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-daya-red text-sm font-semibold transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Password / PIN</label>
          <input type="password" id="passwordInput" placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-daya-red text-sm font-semibold transition">
        </div>

        <!-- Role Selector -->
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-2">pilih peran anda</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectRole('Kacab')" id="roleKacab" class="role-btn border-2 border-gray-200 p-2.5 rounded-2xl text-center hover:border-daya-red transition">
              <span class="block text-xs font-extrabold text-gray-700">Kepala Cabang</span>
            </button>
            <button type="button" onclick="selectRole('PIC NOS')" id="rolePic" class="role-btn border-2 border-gray-200 p-2.5 rounded-2xl text-center hover:border-daya-red transition">
              <span class="block text-xs font-extrabold text-gray-700">PIC NOS</span>
            </button>
            <button type="button" onclick="selectRole('FLP')" id="roleFlp" class="role-btn border-2 border-gray-200 p-2.5 rounded-2xl text-center hover:border-daya-red transition">
              <span class="block text-xs font-extrabold text-gray-700">FLP</span>
            </button>
          </div>
        </div>

        <button id="btnLogin" onclick="handleLogin()" class="w-full bg-daya-red hover:bg-daya-darkred text-white font-extrabold py-3.5 rounded-2xl transition duration-200 shadow-lg shadow-red-200 text-sm">
          masuk
        </button>

        <div class="text-center">
          <a href="#" class="text-xs font-bold text-gray-400 hover:text-daya-red">lupa password?</a>
        </div>
      </div>
    </div>
  </div>

  <!-- SECTION MAIN DASHBOARD -->
  <div id="dashboardSection" class="hidden min-h-screen">
    
    <!-- Top Header Navigation -->
    <header class="bg-white border-b border-gray-100 px-6 py-4 sticky top-0 z-30 flex justify-between items-center shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center font-bold text-daya-red text-sm" id="userAvatar">R</div>
        <div>
          <h1 class="text-xs font-medium text-gray-500">halo, <span id="userNameBadge" class="font-extrabold text-gray-900">pak Rendi</span> 👋</h1>
          <p class="text-[11px] font-bold text-daya-gold" id="userRoleBadge">Kepala Cabang - Soekarno Hatta</p>
        </div>
      </div>
      <button onclick="handleLogout()" class="text-xs font-bold text-gray-400 hover:text-daya-red bg-gray-100 px-3 py-1.5 rounded-xl transition">
        Keluar
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
      
      <!-- TAB HOME / GRID DASHBOARD UTAMA -->
      <div id="tabHomeContent" class="space-y-6">
        
        <!-- Grid Menu Sesuai Prototype -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="menuGrid">
          <!-- Item Menu Card akan di-render secara dinamis sesuai Role dari ScriptJS -->
        </div>

        <!-- Widget Performa Cabang (Donut KPI Card) -->
        <div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm flex items-center gap-5">
          <div class="relative w-20 h-20 flex-shrink-0 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
              <path class="text-gray-100" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path class="text-emerald-500" stroke-dasharray="85, 100" stroke-width="4" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <span class="absolute font-black text-gray-800 text-base">85%</span>
          </div>
          <div class="flex-1 space-y-1">
            <h3 class="font-extrabold text-sm text-gray-900 uppercase tracking-tight">PERFORMA CABANG ANDA</h3>
            <p class="text-xs text-gray-500">Baik! Terus pertahankan standar terbaik anda</p>
            <button onclick="switchTab('pica')" class="text-xs font-bold text-daya-red hover:underline flex items-center gap-1 pt-1">
              Lihat Dashboard <span class="text-base">&rsaquo;</span>
            </button>
          </div>
        </div>

      </div>

      <!-- Container Tab Lainnya (PICA, Leaderboard, Profil, dll) -->
      <div id="otherTabsContainer">
        <!-- Konten PICA, Referensi, GENBA, dan NOSIZU akan dimuat di sini secara dinamis -->
      </div>

    </main>

    <!-- Bottom Navigation Bar (Mobile Native Style) -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 py-2 px-6 flex justify-around items-center z-40">
      <button onclick="switchTab('home')" id="navHome" class="flex flex-col items-center gap-1 text-daya-red font-bold text-[10px]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        home
      </button>
      <button onclick="switchTab('pica')" id="navPica" class="flex flex-col items-center gap-1 text-gray-400 hover:text-daya-red font-bold text-[10px]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        PICA
      </button>
      <button onclick="switchTab('leaderboard')" id="navLeaderboard" class="flex flex-col items-center gap-1 text-gray-400 hover:text-daya-red font-bold text-[10px]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2-1.343-2-3-2z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>
        leaderboard
      </button>
      <button onclick="switchTab('profil')" id="navProfil" class="flex flex-col items-center gap-1 text-gray-400 hover:text-daya-red font-bold text-[10px]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        profil
      </button>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
