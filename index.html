<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daya NOSA - Operations & Standard Audit</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- SECTION LOGIN -->
  <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md space-y-6">
      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-red-600 tracking-tight">Daya NOSA</h1>
        <p class="text-sm text-gray-500 mt-1">Network Operational Standard Audit</p>
      </div>

      <div class="space-y-4">
        <div>
          <label for="emailInput" class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Terdaftar</label>
          <input 
            type="email" 
            id="emailInput" 
            placeholder="kacab1@daya.com" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:outline-none transition" 
          />
        </div>

        <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-lg border border-red-200"></div>

        <button 
          id="loginBtn" 
          onclick="handleLogin()" 
          class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-red-500/30 transition transform active:scale-95"
        >
          Masuk ke Aplikasi
        </button>
      </div>
    </div>
  </div>

  <!-- SECTION MAIN DASHBOARD -->
  <div id="mainDashboard" class="hidden min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-red-600 text-white font-bold text-lg px-3 py-1 rounded-lg">NOSA</div>
          <div>
            <h2 id="userDisplayName" class="font-bold text-sm text-gray-900 leading-tight">Nama User</h2>
            <p id="userDisplayRole" class="text-xs text-gray-500">Role - Cabang</p>
          </div>
        </div>
        <button 
          onclick="handleLogout()" 
          class="text-xs text-red-600 hover:bg-red-50 px-3 py-2 rounded-lg font-semibold border border-red-200 transition"
        >
          Keluar
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-grow space-y-8">
      
      <!-- PICA Section -->
      <section class="space-y-4">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="text-lg font-bold text-gray-900">Daftar PICA (Problem Identification)</h3>
            <p class="text-xs text-gray-500">Temuan audit dan perbaikan operasional</p>
          </div>
          <button 
            onclick="loadPICAData()" 
            class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded-md font-medium transition"
          >
            🔄 Refresh
          </button>
        </div>

        <div id="picaContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <p class="text-gray-500 text-sm col-span-2">Memuat data PICA...</p>
        </div>
      </section>

      <!-- Referensi Standar Section -->
      <section class="space-y-4 border-t border-gray-200 pt-6">
        <div>
          <h3 class="text-lg font-bold text-gray-900">Referensi Standar Operational</h3>
          <p class="text-xs text-gray-500">Panduan standar audit NOS</p>
        </div>

        <div id="referensiContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <p class="text-gray-500 text-sm">Memuat data referensi...</p>
        </div>
      </section>

    </main>
  </div>

  <!-- MODAL UPLOAD BUKTI -->
  <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-gray-800 text-sm" id="modalPicaTitle">Upload Bukti Perbaikan</h3>
        <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <div class="space-y-3">
        <label class="block text-xs font-semibold text-gray-600">Pilih / Ambil Foto</label>
        <input 
          type="file" 
          id="fileInput" 
          accept="image/*" 
          capture="environment" 
          onchange="handleFileSelect(event)" 
          class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100" 
        />
        <img id="imagePreview" class="hidden w-full h-48 object-cover rounded-lg border border-gray-200 mt-2" alt="Preview Foto" />
      </div>

      <div class="flex space-x-2 pt-2">
        <button 
          onclick="closeUploadModal()" 
          class="w-1/2 py-2.5 border border-gray-300 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-50 transition"
        >
          Batal
        </button>
        <button 
          id="submitUploadBtn" 
          onclick="submitPerbaikan()" 
          class="w-1/2 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold shadow-md transition"
        >
          Kirim Bukti
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
