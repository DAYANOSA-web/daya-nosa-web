<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daya NOSA - NOS Assistant</title>
  <!-- Tailwind CSS CDN & Font Montserrat/Inter -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nosa: {
              green: '#2D5343',   /* Hijau tua aksen kiri/bawah */
              yellow: '#E5A933',  /* Kuning mustard aksen kanan/bawah */
              border: '#7FB08E',  /* Hijau garis tepi input */
              button: '#D8E2D8',  /* Warna tombol 'masuk' lembut */
              bgRole: '#E4ECE5'   /* Highlight tombol role aktif */
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-2 sm:p-4 font-sans">

  <!-- CARD UTAMA DASHBOARD / LOGIN -->
  <div class="relative w-full max-w-sm bg-white rounded-[32px] shadow-2xl overflow-hidden border border-gray-100 px-6 py-8 flex flex-col justify-between min-h-[640px]">
    
    <!-- AKSEN TATA LETAK ATAS -->
    <!-- Aksen Hijau Kiri Atas -->
    <div class="absolute top-16 left-0 w-3.5 h-16 bg-nosa-green rounded-r-md"></div>
    <!-- Aksen Kuning Kanan Atas -->
    <div class="absolute top-5 right-0 w-24 h-4 bg-nosa-yellow rounded-l-sm"></div>

    <!-- KONTEN UTAMA (Tengah) -->
    <div class="my-auto space-y-6 pt-4">
      
      <!-- LOGO DAYA NOSA -->
      <div class="text-center flex justify-center items-center">
        <img src="Logo DAYA NOSA.png" alt="Daya NOSA Logo" class="h-28 w-auto object-contain mx-auto">
      </div>

      <!-- TITLE HASIL DESAIN -->
      <h1 class="text-2xl font-normal text-center text-gray-800 tracking-wide">masuk/daftar</h1>

      <!-- INPUT FORM -->
      <div class="space-y-3.5">
        
        <!-- INPUT 1: ID Karyawan / NIK -->
        <div class="relative flex items-center">
          <div class="absolute left-4 text-gray-500">
            <!-- Icon User -->
            <svg class="w-5 h-5 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
          <input type="text" placeholder="ID karyawan / NIK" class="w-full pl-12 pr-4 py-3 rounded-2xl border-2 border-nosa-border bg-white text-sm text-gray-700 placeholder-gray-600 focus:outline-none">
        </div>

        <!-- INPUT 2: Password / PIN -->
        <div class="relative flex items-center">
          <div class="absolute left-4 text-gray-400">
            <!-- Icon Gembok -->
            <svg class="w-5 h-5 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input type="password" placeholder="ID karyawan / NIK" class="w-full pl-12 pr-11 py-3 rounded-2xl border-2 border-nosa-border bg-white text-sm text-gray-700 placeholder-gray-600 focus:outline-none">
          <div class="absolute right-4 text-gray-800 cursor-pointer">
            <!-- Icon Mata -->
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </div>
        </div>

        <!-- PERAN SELECTOR CONTAINER -->
        <div class="space-y-1.5 pt-1">
          <label class="block text-xs font-normal text-gray-700 pl-1">pilih peran anda</label>
          <div class="flex items-center justify-between border-2 border-nosa-border rounded-2xl p-1 bg-white">
            
            <!-- Button Kepala Cabang (Active State) -->
            <button type="button" class="flex-1 flex items-center justify-center gap-1.5 py-1.5 px-2 bg-nosa-bgRole rounded-xl text-gray-800 text-[11px] font-medium">
              <svg class="w-4 h-4 text-gray-700 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span>kepala cabang</span>
            </button>

            <div class="h-4 w-[1px] bg-gray-300 mx-0.5"></div>

            <!-- Button PIC NOS -->
            <button type="button" class="flex-1 flex items-center justify-center gap-1.5 py-1.5 px-2 text-gray-700 text-[11px] font-normal">
              <svg class="w-4 h-4 text-gray-700 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span>PIC NOS</span>
            </button>

            <div class="h-4 w-[1px] bg-gray-300 mx-0.5"></div>

            <!-- Button FLP -->
            <button type="button" class="flex-1 flex items-center justify-center gap-1.5 py-1.5 px-2 text-gray-700 text-[11px] font-normal">
              <svg class="w-4 h-4 text-gray-700 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span>FLP</span>
            </button>

          </div>
        </div>

        <!-- TOMBOL MASUK -->
        <div class="pt-2">
          <button type="button" class="w-full py-3.5 bg-nosa-button text-black font-extrabold text-xl rounded-2xl shadow-md tracking-widest text-center border border-gray-300/40">
            masuk
          </button>
        </div>

        <!-- LINK LUPA PASSWORD -->
        <div class="text-center pt-1">
          <a href="#" class="text-xs text-gray-700 font-normal hover:underline">lupa password?</a>
        </div>

      </div>
    </div>

    <!-- AKSEN TATA LETAK BAWAH -->
    <div class="absolute bottom-0 left-0 flex items-center">
      <div class="w-10 h-3.5 bg-nosa-green"></div>
      <div class="w-20 h-3.5 bg-nosa-yellow"></div>
    </div>

  </div>

</body>
</html>
